name: Deploy Monitoring

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: monitoring-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy monitoring stack
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      GRAFANA_CLOUD_INGEST_TOKEN: ${{ secrets.GRAFANA_CLOUD_INGEST_TOKEN }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${AWS_REGION:?Set AWS_REGION in the production environment}"
          : "${AWS_ROLE_ARN:?Set AWS_ROLE_ARN in the production environment}"
          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID in the production environment}"
          : "${GRAFANA_CLOUD_INGEST_TOKEN:?Set GRAFANA_CLOUD_INGEST_TOKEN secret in the production environment}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: igmo-monitoring-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy monitoring stack through AWS Systems Manager
        run: bash ./deploy/monitoring/apply.sh
