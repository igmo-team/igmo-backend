name: Gemini PR Summary

on:
  pull_request:
    types: [ opened, synchronize ] # PR이 생성되거나 코드가 업데이트될 때 실행
    branches:
      - prod
  workflow_dispatch:
    inputs:
      pr_number:
        description: '요약을 생성할 PR 번호'
        required: true
        type: number

jobs:
  pr-summary:
    runs-on: ubuntu-latest
    
    # ⚠️ Private 레포지토리 필수 설정: PR에 댓글을 쓰기 위한 권한
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 Git 히스토리를 가져와야 diff 분석이 가능합니다.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini AI Dependencies
        run: npm install @google/genai@2.10.0

      - name: Resolve PR Context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let pullRequest = context.payload.pull_request;

            if (!pullRequest) {
              const pullNumber = Number("${{ inputs.pr_number }}");

              if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
                throw new Error("workflow_dispatch 실행 시 pr_number 입력이 필요합니다.");
              }

              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              pullRequest = data;
            }

            fs.appendFileSync(process.env.GITHUB_ENV, [
              `PR_NUMBER=${pullRequest.number}`,
              `BASE_REF=${pullRequest.base.ref}`,
              `BASE_SHA=${pullRequest.base.sha}`,
              `HEAD_SHA=${pullRequest.head.sha}`,
            ].join("\n") + "\n");

      # 1단계: PR의 코드 변경사항(diff)을 추출하여 파일로 저장
      - name: Fetch and Generate Git Diff for PR
        run: |
          git fetch --no-tags --prune origin \
            "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
            "pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER"
          git diff --unified=0 \
            "$BASE_SHA" \
            "$HEAD_SHA" > diff.txt

      # 2단계 & 3단계: Gemini API를 호출하여 요약본 파일 생성
      - name: Call Gemini API to Generate PR Summary
        id: gemini_review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const diff_output = fs.readFileSync("diff.txt", 'utf8');
            const diff_size = Buffer.byteLength(diff_output, "utf8");
            const max_diff_size = 1024 * 1024;

            if (diff_size > max_diff_size) {
              fs.writeFileSync("review_result.txt", `
                ### PR 요약:

                변경 diff가 너무 커서 Gemini 자동 요약을 생성하지 않았습니다.<br>
                PR을 더 작게 나누거나, lock/generated 파일 변경을 제외해 주세요.<br>

                <hr>

                - **diff 크기 :** ${(diff_size / 1024 / 1024).toFixed(2)}MB
                - **기준 :** ${(max_diff_size / 1024 / 1024).toFixed(2)}MB
              `);
              return;
            }

            const { GoogleGenAI } = require("@google/genai");

            // GitHub Secrets에 저장한 API 키를 불러옵니다.
            const ai = new GoogleGenAI({ apiKey: "${{ secrets.GEMINI_API_KEY }}" });

            let prompt = `
              다음은 깃허브 PR에 올라온 수정된 코드들입니다.
              Git diff를 분석하고, 각 변경 사항에 대해 파일명, 수정 내용, 역할을 아래와 같은 형식을 반드시 유지하여 요약해 주세요.

              가장 첫 부분에는 이 PR을 최종 요약하여 알려주세요. 최종 요약 부분의 제목은 "### PR 요약:" 으로 해주세요. PR 요약의 모든 문장은 끝나면 <br>으로 띄어주세요. PR 요약이 끝난 후에는 <hr>을 하나 넣어주세요.

              (각 파일에 대한 요약은 반드시 코드 블럭으로 들어가지 않게 해주세요)
              ### < 경로를 제외한 파일명 > (이 부분의 < >는 유지되게 해주세요)
              - **역할 :** (이 변경 사항의 역할 예: 기능 추가, 버그 수정, 리팩토링 등)
              - **수정 내용 :** (수정된 내용의 간략한 설명. 모든 문장은 끝나면 <br>으로 띄어주세요. 이 부분에서는 줄을 바꾸고 들여쓰기가 유지되도록 띄어주세요.)

              각 파일 내용이 끝나면 <br>으로 한 줄을 띄워주세요.
            
              <git diff>
              ${diff_output}
              </git diff>
            `;

            try {
              const response = await ai.models.generateContent({
                model: "gemini-3.5-flash",
                contents: prompt,
              });
              const text = response.text;

              if (!text || text.trim().length === 0) {
                throw new Error("Gemini API 응답이 비어 있습니다.");
              }
              fs.writeFileSync('review_result.txt', text);
            } catch (error) {
              console.error("❌ Gemini API 요청 중 오류 발생:", error);
              process.exit(1);
            }

      # 4단계: 생성된 요약본 파일을 읽어 PR 댓글로 등록 및 업데이트(Sticky)
      - name: Post PR Summary Comment
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ env.PR_NUMBER }}
          message-id: 'gemini-pr-summary' # 이 ID 덕분에 댓글이 새로 달리지 않고 내용만 계속 업데이트됩니다!
          message-path: review_result.txt
