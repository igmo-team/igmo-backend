name: CD

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "기존 이미지를 새 런타임 환경변수로 재배포합니다. 코드 또는 Dockerfile, 문서 서버 URL 변경에는 사용하지 마세요."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      OPENAPI_SERVER_URL: ${{ vars.OPENAPI_SERVER_URL }}
      WEBSOCKET_DOCS_SERVER_URL: ${{ vars.WEBSOCKET_DOCS_SERVER_URL }}
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IGMO_AI_GEMINI_MODEL: ${{ vars.IGMO_AI_GEMINI_MODEL }}
      IGMO_AI_GEMINI_IMAGE_SIZE: ${{ vars.IGMO_AI_GEMINI_IMAGE_SIZE }}
      IGMO_GAME_DISCONNECT_GRACE: ${{ vars.IGMO_GAME_DISCONNECT_GRACE }}
      IGMO_GAME_PROMPT_DURATION: ${{ vars.IGMO_GAME_PROMPT_DURATION }}
      IGMO_GAME_GUESS_DURATION: ${{ vars.IGMO_GAME_GUESS_DURATION }}
      IGMO_GAME_VOTE_DURATION: ${{ vars.IGMO_GAME_VOTE_DURATION }}
      IGMO_GAME_RESULT_DURATION: ${{ vars.IGMO_GAME_RESULT_DURATION }}
      IGMO_GAME_IMAGE_GENERATION_COMPLETION_DELAY: ${{ vars.IGMO_GAME_IMAGE_GENERATION_COMPLETION_DELAY }}
      IGMO_GAME_DRAIN_TIMEOUT: ${{ vars.IGMO_GAME_DRAIN_TIMEOUT }}
      IGMO_IMAGE_STORAGE_S3_BUCKET: ${{ vars.IGMO_IMAGE_STORAGE_S3_BUCKET }}
      IGMO_IMAGE_STORAGE_S3_REGION: ${{ vars.IGMO_IMAGE_STORAGE_S3_REGION }}
      IGMO_IMAGE_STORAGE_S3_KEY_PREFIX: ${{ vars.IGMO_IMAGE_STORAGE_S3_KEY_PREFIX }}
      IGMO_IMAGE_STORAGE_S3_PUBLIC_BASE_URL: ${{ vars.IGMO_IMAGE_STORAGE_S3_PUBLIC_BASE_URL }}
      IGMO_ADMIN_IMAGE_GENERATION_USERNAME: ${{ secrets.IGMO_ADMIN_IMAGE_GENERATION_USERNAME }}
      IGMO_ADMIN_IMAGE_GENERATION_PASSWORD: ${{ secrets.IGMO_ADMIN_IMAGE_GENERATION_PASSWORD }}
      IGMO_ADMIN_IMAGE_GENERATION_ALLOWED_MODELS: ${{ vars.IGMO_ADMIN_IMAGE_GENERATION_ALLOWED_MODELS }}
      IGMO_ADMIN_IMAGE_GENERATION_ALLOWED_IMAGE_SIZES: ${{ vars.IGMO_ADMIN_IMAGE_GENERATION_ALLOWED_IMAGE_SIZES }}
      IGMO_ADMIN_IMAGE_STORAGE_S3_BUCKET: ${{ vars.IGMO_ADMIN_IMAGE_STORAGE_S3_BUCKET }}
      IGMO_ADMIN_IMAGE_STORAGE_S3_KEY_PREFIX: ${{ vars.IGMO_ADMIN_IMAGE_STORAGE_S3_KEY_PREFIX }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      # 1. 이번 배포 대상 commit을 runner에 내려받습니다.
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # 2. production 환경변수가 모두 설정되었는지 확인합니다.
      - name: Validate deployment configuration
        id: validate
        shell: bash
        run: |
          : "${AWS_REGION:?Set AWS_REGION in the production environment}"
          : "${AWS_ROLE_ARN:?Set AWS_ROLE_ARN in the production environment}"
          : "${ECR_REPOSITORY:?Set ECR_REPOSITORY in the production environment}"
          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID in the production environment}"
          : "${OPENAPI_SERVER_URL:?Set OPENAPI_SERVER_URL in the production environment}"
          : "${WEBSOCKET_DOCS_SERVER_URL:?Set WEBSOCKET_DOCS_SERVER_URL in the production environment}"
          : "${GEMINI_API_KEY:?Set GEMINI_API_KEY in the production environment}"
          : "${IGMO_AI_GEMINI_MODEL:?Set IGMO_AI_GEMINI_MODEL in the production environment}"
          : "${IGMO_AI_GEMINI_IMAGE_SIZE:?Set IGMO_AI_GEMINI_IMAGE_SIZE in the production environment}"
          : "${IGMO_GAME_DISCONNECT_GRACE:?Set IGMO_GAME_DISCONNECT_GRACE in the production environment}"
          : "${IGMO_GAME_PROMPT_DURATION:?Set IGMO_GAME_PROMPT_DURATION in the production environment}"
          : "${IGMO_GAME_GUESS_DURATION:?Set IGMO_GAME_GUESS_DURATION in the production environment}"
          : "${IGMO_GAME_VOTE_DURATION:?Set IGMO_GAME_VOTE_DURATION in the production environment}"
          : "${IGMO_GAME_RESULT_DURATION:?Set IGMO_GAME_RESULT_DURATION in the production environment}"
          : "${IGMO_GAME_IMAGE_GENERATION_COMPLETION_DELAY:?Set IGMO_GAME_IMAGE_GENERATION_COMPLETION_DELAY in the production environment}"
          : "${IGMO_GAME_DRAIN_TIMEOUT:?Set IGMO_GAME_DRAIN_TIMEOUT in the production environment}"
          : "${IGMO_IMAGE_STORAGE_S3_BUCKET:?Set IGMO_IMAGE_STORAGE_S3_BUCKET in the production environment}"
          : "${IGMO_IMAGE_STORAGE_S3_REGION:?Set IGMO_IMAGE_STORAGE_S3_REGION in the production environment}"
          : "${IGMO_IMAGE_STORAGE_S3_KEY_PREFIX:?Set IGMO_IMAGE_STORAGE_S3_KEY_PREFIX in the production environment}"
          : "${IGMO_ADMIN_IMAGE_STORAGE_S3_BUCKET:?Set IGMO_ADMIN_IMAGE_STORAGE_S3_BUCKET in the production environment}"
          : "${IGMO_ADMIN_IMAGE_STORAGE_S3_KEY_PREFIX:?Set IGMO_ADMIN_IMAGE_STORAGE_S3_KEY_PREFIX in the production environment}"

      # 3. 배포 시작 사실을 Discord에 알립니다. 알림 실패는 배포를 중단시키지 않습니다.
      - name: Notify Discord of deployment start
        if: ${{ success() }}
        continue-on-error: true
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: bash .github/scripts/notify-discord.sh start

      # 4. Spring Boot와 Gradle 빌드에 사용할 Java 25를 준비합니다.
      - name: Set up JDK
        id: setup_java
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_only }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # 5. WebSocket 문서 생성에 사용할 Node.js와 npm 캐시를 준비합니다.
      - name: Set up Node.js
        id: setup_node
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_only }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 6. 테스트를 통과한 뒤 API·WebSocket 문서와 실행 가능한 JAR을 만듭니다.
      - name: Build application JAR and documents
        id: build_artifact
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_only }}
        run: bash .github/scripts/build-artifact.sh

      # 7. 이후 ECR과 EC2에 접근할 AWS 권한을 OIDC로 설정합니다.
      - name: Configure AWS credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: igmo-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 8. 생성한 Docker 이미지를 업로드할 ECR에 로그인합니다.
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 9. deploy_only 실행이면 새 이미지를 만들지 않고 기존 이미지만 확인합니다.
      - name: Verify existing image for deploy-only
        id: verify_image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_only }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$DEPLOY_SHA" >/dev/null

      # 10. ARM64 이미지 빌드에 필요한 에뮬레이터를 준비합니다.
      - name: Set up QEMU
        id: qemu
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_only }}
        uses: docker/setup-qemu-action@v4

      # 11. ARM64 Docker 이미지를 빌드할 Buildx를 준비합니다.
      - name: Set up Docker Buildx
        id: buildx
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_only }}
        uses: docker/setup-buildx-action@v4

      # 12. JAR이 포함된 이미지를 만들고 ECR에 commit SHA 태그로 업로드합니다.
      - name: Build and push ARM64 image
        id: build_push
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_only }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 13. SSM을 통해 EC2에서 Blue-Green 배포를 실행합니다.
      - name: Deploy image through AWS Systems Manager
        id: deploy
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        run: bash .github/scripts/deploy-via-ssm.sh

      # 14. EC2 배포가 성공했을 때 결과를 Discord에 알립니다.
      - name: Notify Discord of successful deployment
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: bash .github/scripts/notify-discord.sh success

      # 15. 앞 단계가 실패했을 때 실패 단계와 복구 상태를 Discord에 알립니다.
      - name: Notify Discord of failed deployment
        if: ${{ !cancelled() && failure() && steps.deploy.outcome != 'success' }}
        continue-on-error: true
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_JAVA_OUTCOME: ${{ steps.setup_java.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          BUILD_ARTIFACT_OUTCOME: ${{ steps.build_artifact.outcome }}
          AWS_AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
          ECR_LOGIN_OUTCOME: ${{ steps.ecr-login.outcome }}
          VERIFY_IMAGE_OUTCOME: ${{ steps.verify_image.outcome }}
          QEMU_OUTCOME: ${{ steps.qemu.outcome }}
          BUILDX_OUTCOME: ${{ steps.buildx.outcome }}
          BUILD_PUSH_OUTCOME: ${{ steps.build_push.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_FAILURE_STAGE: ${{ steps.deploy.outputs.failure_stage }}
          DEPLOY_FAILURE_REASON: ${{ steps.deploy.outputs.failure_reason }}
          DEPLOY_CLEANUP_STATUS: ${{ steps.deploy.outputs.cleanup_status }}
          DEPLOY_NGINX_RECOVERY_STATUS: ${{ steps.deploy.outputs.nginx_recovery_status }}
        run: bash .github/scripts/notify-discord.sh failure
