name: igmo-monitoring

services:
  alloy:
    image: grafana/alloy:v1.18.0
    network_mode: host
    command: run /etc/alloy/config.alloy --server.http.listen-addr=127.0.0.1:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - /opt/igmo/monitoring-secrets/grafana-cloud-ingest-token:/run/secrets/grafana-cloud-ingest-token:ro
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 32m
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    network_mode: host
    command:
      - --docker_only=true
      - --listen_ip=127.0.0.1
      - --port=18081
      - --storage_duration=2m
      - --housekeeping_interval=15s
      - --enable_metrics=memory,oom_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    privileged: true
    mem_limit: 128m
    restart: unless-stopped

volumes:
  alloy-data:
