spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: igmo

igmo:
  game:
    disconnect-grace: 3s
    prompt-duration: 30s
    guess-duration: 10s
    vote-duration: 10s
    result-duration: 5s
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${IGMO_AI_GEMINI_MODEL}
      image-size: ${IGMO_AI_GEMINI_IMAGE_SIZE}
  image-storage:
    s3:
      bucket: ${IGMO_IMAGE_STORAGE_S3_BUCKET}
      region: ${IGMO_IMAGE_STORAGE_S3_REGION}
      key-prefix: ${IGMO_IMAGE_STORAGE_S3_KEY_PREFIX}
      public-base-url: ${IGMO_IMAGE_STORAGE_S3_PUBLIC_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
