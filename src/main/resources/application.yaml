spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: igmo
  data:
    redis:
      host: ${IGMO_REDIS_HOST:redis}
      port: ${IGMO_REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: ${IGMO_GAME_DRAIN_TIMEOUT}

igmo:
  deployment:
    slot: ${IGMO_DEPLOYMENT_SLOT:blue}
    port: ${IGMO_DEPLOYMENT_PORT:${SERVER_PORT:8080}}
  game:
    disconnect-grace: ${IGMO_GAME_DISCONNECT_GRACE}
    prompt-duration: ${IGMO_GAME_PROMPT_DURATION}
    guess-duration: ${IGMO_GAME_GUESS_DURATION}
    vote-duration: ${IGMO_GAME_VOTE_DURATION}
    vote-skipped-duration: ${IGMO_GAME_VOTE_SKIPPED_DURATION:3s}
    result-duration: ${IGMO_GAME_RESULT_DURATION}
    image-generation-completion-delay: ${IGMO_GAME_IMAGE_GENERATION_COMPLETION_DELAY}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${IGMO_AI_GEMINI_MODEL}
      image-size: ${IGMO_AI_GEMINI_IMAGE_SIZE}
  admin:
    image-generation:
      username: ${IGMO_ADMIN_IMAGE_GENERATION_USERNAME:}
      password: ${IGMO_ADMIN_IMAGE_GENERATION_PASSWORD:}
      allowed-models: ${IGMO_ADMIN_IMAGE_GENERATION_ALLOWED_MODELS:${IGMO_AI_GEMINI_MODEL}}
      allowed-image-sizes: ${IGMO_ADMIN_IMAGE_GENERATION_ALLOWED_IMAGE_SIZES:${IGMO_AI_GEMINI_IMAGE_SIZE}}
      max-concurrent-requests: ${IGMO_ADMIN_IMAGE_GENERATION_MAX_CONCURRENT_REQUESTS:1}
      storage:
        s3:
          bucket: ${IGMO_ADMIN_IMAGE_STORAGE_S3_BUCKET:}
          key-prefix: ${IGMO_ADMIN_IMAGE_STORAGE_S3_KEY_PREFIX}
  image-storage:
    s3:
      bucket: ${IGMO_IMAGE_STORAGE_S3_BUCKET}
      region: ${IGMO_IMAGE_STORAGE_S3_REGION}
      key-prefix: ${IGMO_IMAGE_STORAGE_S3_KEY_PREFIX}
      public-base-url: ${IGMO_IMAGE_STORAGE_S3_PUBLIC_BASE_URL}

management:
  tracing:
    enabled: ${IGMO_TRACING_ENABLED:false}
    sampling:
      probability: ${IGMO_TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  otlp:
    tracing:
      endpoint: ${IGMO_TRACING_OTLP_ENDPOINT:}
      export:
        enabled: ${IGMO_TRACING_ENABLED:false}
      headers:
        Authorization: ${IGMO_TRACING_OTLP_AUTHORIZATION:}
      transport: http
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        igmo.redis.operation.duration: true
