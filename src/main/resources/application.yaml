spring:
  application:
    name: igmo

igmo:
  game:
    disconnect-grace: 3s
    prompt-duration: 30s
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${IGMO_AI_GEMINI_MODEL:gemini-3.1-flash-image}
      image-size: ${IGMO_AI_GEMINI_IMAGE_SIZE:1K}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
