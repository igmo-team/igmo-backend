services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAPI_SERVER_URL: ${OPENAPI_SERVER_URL:-http://localhost:8080}
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8080:8080"
    restart: always
