server {
    listen 80;
    listen [::]:80;

    server_name monitoring.igmo.co.kr;

    access_log /var/log/nginx/monitoring.access.log;
    error_log /var/log/nginx/monitoring.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
