server {
    listen 80;
    listen [::]:80;

    server_name igmo.co.kr www.igmo.co.kr;

    access_log /var/log/nginx/igmo.access.log;
    error_log /var/log/nginx/igmo.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://igmo.co.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.igmo.co.kr;

    ssl_certificate /etc/letsencrypt/live/www.igmo.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.igmo.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/igmo.access.log;
    error_log /var/log/nginx/igmo.error.log warn;

    return 301 https://igmo.co.kr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name igmo.co.kr;

    ssl_certificate /etc/letsencrypt/live/www.igmo.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.igmo.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/igmo.access.log;
    error_log /var/log/nginx/igmo.error.log warn;

    location / {
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
